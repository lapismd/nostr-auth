name: Publish container image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/nostr-auth-pomegranate

jobs:
  verify:
    name: Repository and 2-of-3 smoke checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      COMPOSE_PROJECT_NAME: nostr-auth-publish-${{ github.run_id }}-${{ github.run_attempt }}
      POMEGRANATE_IMAGE_TAG: publish-${{ github.run_id }}-${{ github.run_attempt }}
      POMEGRANATE_TEST_IMAGE_TAG: publish-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the pinned test environment
        shell: bash
        run: >-
          docker build --pull --file docker/Dockerfile.test
          --tag "nostr-auth/test:${POMEGRANATE_TEST_IMAGE_TAG}" .

      - name: Run formatting, lint, type, specification, vendor, and unit checks
        shell: bash
        run: |
          docker run --rm \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            "nostr-auth/test:${POMEGRANATE_TEST_IMAGE_TAG}" \
            task check:all

      - name: Build the pinned Pomegranate image
        shell: bash
        run: docker compose -f compose.yml -f compose.dev.yml build --pull central

      - name: Reject fixable high and critical runtime vulnerabilities
        shell: bash
        run: |
          docker run --rm \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=2g,mode=1777 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --volume /var/run/docker.sock:/var/run/docker.sock:ro \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            --cache-dir /tmp/trivy image \
            --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 --no-progress \
            "nostr-auth/pomegranate:${POMEGRANATE_IMAGE_TAG}"

      - name: Run the live 2-of-3 protocol smoke test
        shell: bash
        run: |
          DOCKER_SOCKET_GID="$(stat --format=%g /var/run/docker.sock)"
          export DOCKER_SOCKET_GID
          docker compose -f compose.yml -f compose.dev.yml --profile test \
            run --rm test-runner task smoke

      - name: Remove test containers and volumes
        if: always()
        shell: bash
        run: >-
          docker compose -f compose.yml -f compose.dev.yml --profile test
          down --volumes --remove-orphans

  publish:
    name: Publish signed build evidence
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Normalize the registry path
        shell: bash
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Read the governed upstream commit
        id: vendor
        shell: bash
        run: echo "pomegranate_ref=$(jq -r '.commit' vendor/pomegranate.lock.json)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.37.0
          driver-opts: image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=auto
          tags: |
            type=sha,format=long
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push the multi-architecture image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: POMEGRANATE_REF=${{ steps.vendor.outputs.pomegranate_ref }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          push: true
          pull: true
          no-cache: true
          provenance: mode=max
          sbom: generator=docker/buildkit-syft-scanner:stable-1@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9

      - name: Publish GitHub build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Verify the image is anonymously readable
        shell: bash
        run: |
          docker logout ghcr.io
          docker buildx imagetools inspect "${IMAGE_NAME}@${{ steps.push.outputs.digest }}" >/dev/null
